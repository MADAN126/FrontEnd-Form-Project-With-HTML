<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madan's Website</title>
</head>
<body>
   <form action="" method="POST">
    <div>
        <label for="username">enter your name</label>
    <input minlength="5" required maxlength="10" type="text" id="username" name="username" placeholder="enter your name">
    </div>
   <div>
    <div>
        <label for="smsalert">SmsAlert</label>
        <input type="checkbox" name="sms alert" id="smsalert">
        
        <label for="emailalert">EmailAlert</label>
        <input type="checkbox" name="email alert" id="emailalert">
    </div>
    <div>
       <div id="labelforgender">
         <label for="">Gender</label>
       </div>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <label for="phone">enter your phone</label>
        <input type="tele" name="phone" id="phone">
    </div>
    <div>
        <select name="state" id="state" multiple>
            <option value="Tamil nadu">Tamil nadu</option>
            <option value="Adra pradesh">AP</option>
            <option value="Kerala">Kerala</option>
        </select>
    </div>
    <div>
        <label for="dob">enter your date of birth</label>
        <input type="date" id="dob" min="01-01-1900" max="31-12-2050" name="dob">
    </div>
    <div>
        <label for="email">enter your email</label>
        <input type="email" id="email" name="email" placeholder="enter your email">
    </div>
     <label for="pwd">enter your password</label>
    <input required type="password" id="pwd" name="password" placeholder="enter your password">
   </div>
   <div>
    <label for="">enter your feedback</label>
    <textarea name="" id="" cols="40" rows="4">about me</textarea>
   </div>
   <div>
    <label for="file">Resume</label>
    <input type="file" name="file" id="file">
   </div>
    <button type="submit">Sign up</button>
    <button type="reset">reset</button>
   </form>
</body>
</html>
